<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="{{ url_for('index') }}">{{ app_name }}</a>
      <span class="tag">Team Tools</span>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="wrap foot">
    <p>{{ app_name }} &middot; Today is {{ today }}. Rankings reflect the latest published editions; verify against the source before reporting.</p>
  </footer>
</body>
</html>
